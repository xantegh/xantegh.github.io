<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Tools</title>
<meta name="description" content="Daily tools brought to you by Antoine.">
<link rel="canonical" href="https://xantegh.github.io/">
<meta property="og:title" content="Daily Tools by Antoine">
<meta property="og:description" content="Small, fast, offline-friendly tools.">
<meta property="og:url" content="https://xantegh.github.io/">
<style>
@property --angle{syntax:"<angle>";initial-value:0deg;inherits:false}
:root{
  --bg:#070a14;--fg:#e8ecf6;--muted:#8f99b3;--card:#0e1325;--line:#1c2340;
  --a1:#77b8ff;--a2:#b78cff;
}
:root[data-theme=light]{
  --bg:#f3f6fc;--fg:#0e1530;--muted:#58627e;--card:#ffffff;--line:#dbe2f2;
  --a1:#2b6fd6;--a2:#8a5cf0;
}
*{box-sizing:border-box;margin:0}
html{color-scheme:dark}
:root[data-theme=light]{color-scheme:light}
body{
  min-height:100vh;background:var(--bg);color:var(--fg);
  font:16px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Inter,Roboto,sans-serif;
  display:flex;flex-direction:column;overflow-x:hidden;
}
/* ambient background glow */
body::before,body::after{
  content:"";position:fixed;width:60vmax;height:60vmax;border-radius:50%;
  filter:blur(120px);opacity:.18;z-index:-1;pointer-events:none;
}
body::before{background:var(--a1);top:-30vmax;left:-20vmax}
body::after{background:var(--a2);bottom:-35vmax;right:-20vmax}

.wrap{width:min(1080px,100% - 32px);margin-inline:auto}

nav{display:flex;justify-content:space-between;align-items:center;padding:20px 0}
.brand{font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.dot{width:12px;height:12px;border-radius:4px;background:linear-gradient(135deg,var(--a1),var(--a2));
  box-shadow:0 0 14px var(--a1)}
#theme{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:999px;
  padding:7px 14px;font:inherit;font-size:14px;cursor:pointer;transition:border-color .2s}
#theme:hover{border-color:var(--a1)}

header{padding:clamp(40px,9vw,96px) 0 clamp(28px,5vw,56px);text-align:center}
.eyebrow{display:inline-block;font-size:13px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 14px;margin-bottom:20px}
h1{font-size:clamp(2.4rem,7vw,4.4rem);line-height:1.05;letter-spacing:-.03em;font-weight:800}
.grad{background:linear-gradient(100deg,var(--a1),var(--a2));-webkit-background-clip:text;
  background-clip:text;color:transparent}
.sub{margin-top:18px;color:var(--muted);font-size:clamp(1rem,2.2vw,1.2rem)}
.sub b{color:var(--fg);font-weight:600}

main{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:24px;padding-bottom:64px}

/* ── rotating glow card ── */
.card{
  --c:var(--a1);
  position:relative;display:flex;flex-direction:column;gap:14px;
  padding:26px;border-radius:20px;text-decoration:none;color:inherit;isolation:isolate;
  background:var(--card);transition:transform .25s ease;
}
.card::before,.card::after{
  content:"";position:absolute;inset:-1.5px;border-radius:inherit;z-index:-2;
  background:conic-gradient(from var(--angle),transparent 0 55%,var(--c) 85%,transparent 100%);
  animation:spin 4.5s linear infinite;
}
.card::after{filter:blur(18px);opacity:.55;transition:opacity .3s}
.card .face{position:absolute;inset:0;border-radius:inherit;background:var(--card);z-index:-1}
.card:hover{transform:translateY(-4px)}
.card:hover::after{opacity:1}
.card:focus-visible{outline:2px solid var(--c);outline-offset:4px}
@keyframes spin{to{--angle:360deg}}

.icon{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;
  font:700 17px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--c);
  background:color-mix(in srgb,var(--c) 14%,transparent);
  border:1px solid color-mix(in srgb,var(--c) 35%,transparent)}
.card h2{font-size:1.3rem;letter-spacing:-.01em}
.card p{color:var(--muted);font-size:.95rem;flex:1}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11.5px;padding:3px 9px;border-radius:999px;color:var(--muted);border:1px solid var(--line)}
.open{font-size:14px;font-weight:600;color:var(--c);white-space:nowrap;transition:transform .2s}
.card:hover .open{transform:translateX(4px)}

footer{text-align:center;color:var(--muted);font-size:13px;padding:28px 0 36px;border-top:1px solid var(--line)}
footer a{color:var(--fg)}

@media (prefers-reduced-motion:reduce){.card::before,.card::after{animation:none}.card{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <div class="brand"><span class="dot"></span><span id="brand"></span></div>
    <button id="theme" aria-label="Toggle theme">☀ Theme</button>
  </nav>
  <header>
    <span class="eyebrow" id="eyebrow">Updated daily</span>
    <h1 id="title"></h1>
    <p class="sub" id="sub"></p>
  </header>
</div>
<main><div class="wrap"><div class="grid" id="grid"></div></div></main>
<footer><div class="wrap"><span id="foot"></span> <a id="gh" hidden>GitHub</a></div></footer>

<script src="config.js"></script>
<script>
(function(){
  // Built-in defaults: used if config.js is missing/not deployed, so the page is never blank.
  var DEFAULTS = {
    title:"Daily Tools", tagline:"Small, fast, offline-friendly tools — brought to you by", author:"Antoine",
    footer:"Built with care. No tracking, no servers — your data stays in your browser.", githubUrl:"https://github.com/xantegh",
    tools:[
      {name:"JSON Studio",description:"Paste raw JSON, then explore, search, and navigate it as a tree. Fully offline.",url:"json_explorer.html",icon:"{ }",tags:["JSON","Explorer"],color:"#77b8ff"},
      {name:"XML Studio",description:"Paste raw XML and browse, search, and export its structure without leaving your browser.",url:"xml_explorer.html",icon:"</>",tags:["XML","Explorer"],color:"#ff8a5c"}
    ]
  };
  var cfg = window.SITE_CONFIG || DEFAULTS;
  if(!window.SITE_CONFIG) console.warn("config.js not found — using built-in defaults");
  var $ = function(id){return document.getElementById(id)};

  document.title = cfg.title + " by " + cfg.author;
  $("brand").textContent = cfg.title;
  $("title").innerHTML = "";
  var words = (cfg.title||"").split(" ");
  var last = words.pop();
  $("title").append(document.createTextNode(words.join(" ") + (words.length ? " " : "")));
  var g = document.createElement("span"); g.className = "grad"; g.textContent = last;
  $("title").append(g);
  $("sub").innerHTML = "";
  $("sub").append(document.createTextNode(cfg.tagline + " "));
  var b = document.createElement("b"); b.textContent = cfg.author; $("sub").append(b);
  $("foot").textContent = cfg.footer || "";
  if(cfg.githubUrl){ $("gh").href = cfg.githubUrl; $("gh").hidden = false; }

  var grid = $("grid");
  (cfg.tools||[]).forEach(function(t, i){
    var a = document.createElement("a");
    a.className = "card"; a.href = t.url;
    if(t.color) a.style.setProperty("--c", t.color);
    a.style.animationDelay = a.style.getPropertyValue("--d");
    // stagger rotation so cards don't spin in lockstep
    a.style.setProperty("--delay", (-i*1.3)+"s");
    var face = document.createElement("div"); face.className = "face";
    var ic = document.createElement("div"); ic.className = "icon"; ic.textContent = t.icon || "◈";
    var h = document.createElement("h2"); h.textContent = t.name;
    var p = document.createElement("p"); p.textContent = t.description;
    var foot = document.createElement("div"); foot.className = "foot";
    var tags = document.createElement("div"); tags.className = "tags";
    (t.tags||[]).forEach(function(x){var s=document.createElement("span");s.className="tag";s.textContent=x;tags.append(s)});
    var o = document.createElement("span"); o.className = "open"; o.textContent = "Open →";
    foot.append(tags, o);
    a.append(face, ic, h, p, foot);
    grid.append(a);
  });

  // theme
  var root = document.documentElement;
  try{ var s = localStorage.getItem("theme"); if(s) root.dataset.theme = s; }catch(e){}
  $("theme").onclick = function(){
    var n = root.dataset.theme === "light" ? "dark" : "light";
    root.dataset.theme = n;
    try{ localStorage.setItem("theme", n); }catch(e){}
  };
})();
</script>
<style>.card::before,.card::after{animation-delay:var(--delay,0s)}</style>
</body>
</html>
